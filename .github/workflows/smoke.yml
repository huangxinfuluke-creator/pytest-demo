name: Smoke Scheduled

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "15 3 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: pip install -r requirements.txt

      - run: pytest -m smoke
